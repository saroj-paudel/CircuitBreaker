[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circuitbreaker"
version = "0.1.0"
description = "Local-first, deterministic-first security proxy for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
circuitbreaker = "circuitbreaker.__main__:run"
circuitbreaker-proxy = "circuitbreaker.proxy.__main__:run"
circuitbreaker-hook = "circuitbreaker.hooks.__main__:run"
circuitbreaker-audit = "circuitbreaker.audit:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/circuitbreaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
